name: Qualidade

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Grupo por evento: um push na main não substitui um deploy manual que ainda está na fila.
  group: quality-${{ github.event_name }}-${{ github.ref }}
  # Em PR, um push novo cancela a execução antiga; na main, nenhum deploy é interrompido.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Navegador do smoke test (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Verificações (npm run verify)
        run: npm run verify

      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Links quebrados (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Esses sites bloqueiam robôs (999/403/TLS), mas funcionam no navegador. As URLs são
          # verificadas manualmente no roteiro de testes.
          # O github.com responde 503 (servidor ocupado, não link quebrado) a rajadas vindas do runner,
          # e o lychee só repete em 429: menos requisições por host e 503 aceito. 404 continua falhando.
          # URLs do próprio site (canonical, og:url) são conferidas nos arquivos do commit: uma página
          # nova ainda não está no ar antes do deploy. Caminhos "/Portfolio/…" (o <base> da 404.html)
          # também apontam para a raiz do repositório, como no Pages.
          args: >-
            --no-progress
            --host-concurrency 4
            --accept '100..=103,200..=299,503'
            --exclude 'linkedin\.com'
            --exclude 'lattes\.cnpq\.br'
            --exclude 'udemy\.com'
            --exclude-path node_modules
            --root-dir ${{ github.workspace }}
            --remap 'https://blima-p\.github\.io/Portfolio/ file://${{ github.workspace }}/'
            --remap 'file://${{ github.workspace }}/Portfolio(/|$) file://${{ github.workspace }}/'
            index.html 404.html 'projetos/*.html' README.md CONTRIBUTING.md SECURITY.md

      # Portão de desempenho (lighthouserc.json): asserções em erro, cada uma pela mediana de 3 rodadas.
      # A API do GitHub fica bloqueada na medição: do IP compartilhado do runner ela devolve 403 (limite de
      # 60/h), o que sujaria o console e Best Practices sem ser defeito do site (o fallback é testado no smoke).
      # Action presa ao commit da 12.6.2: ela traz o node_modules, então isso fixa o LHCI e o Lighthouse.
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # Roda também em PR: uma referência a arquivo fora da lista pública falha antes do merge.
      - name: Montar o site publicado (_site)
        run: npm run pack:site

      # Só um disparo manual na main publica (deploy sob demanda, juntando vários merges num deploy só).
      # O site sai do mesmo commit que passou em todas as verificações acima.
      - name: Enviar artefato do GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    name: deploy
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
