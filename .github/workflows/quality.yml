name: Qualidade

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  # Em PR, um push novo cancela a execução antiga; na main, nenhum deploy é interrompido.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Navegador do smoke test (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Verificações (npm run verify)
        run: npm run verify

      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Links quebrados (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # linkedin.com responde 999 para robôs; lattes.cnpq.br falha no handshake TLS do lychee
          # (o link funciona no navegador). Ambos são verificados manualmente no roteiro de testes.
          args: >-
            --no-progress
            --exclude 'linkedin\.com'
            --exclude 'lattes\.cnpq\.br'
            --exclude-path node_modules
            --root-dir ${{ github.workspace }}
            index.html README.md CONTRIBUTING.md SECURITY.md docs/plano-implementacao.md

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # Roda também em PR: uma referência a arquivo fora da lista pública falha antes do merge.
      - name: Montar o site publicado (_site)
        run: npm run pack:site

      # Só um disparo manual na main publica (deploy sob demanda, juntando vários merges num deploy só).
      # O site sai do mesmo commit que passou em todas as verificações acima.
      - name: Enviar artefato do GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    name: deploy
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
