# Labels do repositório como código. Sincronizadas por .github/workflows/labels.yml em push na main
# (em PRs, só simula). Label que não estiver aqui é apagada. Para renomear preservando as issues, use
# `from_name` só no PR da renomeação e remova depois: com o destino já existente, o labeler ignora a
# entrada inteira e deixaria de sincronizar cor e descrição.

# ---- Tipo (espelha os tipos do Conventional Commits) ----
- name: 'bug'
  color: '#d73a4a'
  description: 'Algo não funciona como deveria'
- name: 'feat'
  color: '#a2eeef'
  description: 'Funcionalidade nova ou melhoria visível'
- name: 'docs'
  color: '#0075ca'
  description: 'Documentação: README, plano, ADRs, guias'
- name: 'refactor'
  color: '#c5def5'
  description: 'Mudança interna sem alterar o comportamento'
- name: 'test'
  color: '#bfd4f2'
  description: 'Testes automatizados'
- name: 'ci'
  color: '#5319e7'
  description: 'Workflows, deploy e automação do repositório'
- name: 'dependencies'
  color: '#0366d6'
  description: 'Atualização de dependências (Dependabot)'

# ---- Qualidade ----
- name: 'a11y'
  color: '#1d76db'
  description: 'Acessibilidade (WCAG 2.2 AA)'
- name: 'perf'
  color: '#fbca04'
  description: 'Desempenho: Lighthouse, peso, Core Web Vitals'
- name: 'seo'
  color: '#0e8a16'
  description: 'SEO, metadados e compartilhamento'
- name: 'segurança'
  color: '#b60205'
  description: 'Segurança: CSP, dependências, dados expostos'

# ---- Área ----
- name: 'conteúdo'
  color: '#f9d0c4'
  description: 'Textos e afirmações do site (exige fonte na matriz de fatos)'
- name: 'visual'
  color: '#d4c5f9'
  description: 'Identidade visual, layout e responsividade'
- name: 'i18n'
  color: '#c2e0c6'
  description: 'Traduções PT-BR / EN'

# ---- Prioridade ----
- name: 'prioridade: alta'
  color: '#b60205'
  description: 'Bloqueia o recrutador ou quebra produção'
- name: 'prioridade: média'
  color: '#d93f0b'
  description: 'Afeta a impressão, mas não bloqueia'
- name: 'prioridade: baixa'
  color: '#fef2c0'
  description: 'Detalhe ou polimento'

# ---- Triagem ----
- name: 'good first issue'
  color: '#7057ff'
  description: 'Boa para quem quer contribuir pela primeira vez'
- name: 'help wanted'
  color: '#008672'
  description: 'Contribuições são bem-vindas'
- name: 'duplicate'
  color: '#cfd3d7'
  description: 'Já existe issue ou PR para isto'
- name: 'wontfix'
  color: '#ffffff'
  description: 'Não será feito (justificativa na issue)'
